name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f voice-line/requirements.txt ]; then pip install -r voice-line/requirements.txt; fi
          if [ -f voice-line/pyproject.toml ]; then pip install -e voice-line; fi

      - name: Run lightweight validation
        run: |
          python -m compileall voice-line
