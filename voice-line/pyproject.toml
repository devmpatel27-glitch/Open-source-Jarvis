[project]
name = "voice-line"
version = "0.1.0"
description = "Real-time voice assistant for Open Source Jarvis"
requires-python = ">=3.10"
dependencies = [
  "pyaudio>=0.2.14",
  "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
